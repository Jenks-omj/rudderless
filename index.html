<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rudderless VJ</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Output preview: one layer per deck, stacked in deck order (deck 1 at the bottom).
       Fullscreen (F) blows this box up to fill the screen. -->
  <div id="stage"></div>

  <div id="panel">
    <header class="topbar">
      <span class="brand">rudderless</span>
      <button id="btnFullscreen" type="button" title="Fullscreen output (F)">Fullscreen</button>
      <button id="btnBlackout" type="button" title="Blackout (B)">Blackout</button>
      <button id="btnShare" type="button" title="Copy a link that opens with these playlists and effects loaded">Share</button>
      <label class="master" title="Glitch bars over all decks">
        <span>Bars</span><input id="masterBars" type="range" min="0" max="100" step="1" value="0">
      </label>
      <label class="master" title="Scanlines over all decks">
        <span>Scanlines</span><input id="masterScan" type="range" min="0" max="100" step="1" value="0">
      </label>
      <span class="spacer"></span>
      <form class="apikey" onsubmit="return false" title="Optional: lets Search load 10 results straight into a deck">
        <label for="apiKey">API key</label>
        <input id="apiKey" type="password" placeholder="optional" autocomplete="off" spellcheck="false">
      </form>
      <span class="keys">1–4 deck on/off · F fullscreen · B blackout</span>
    </header>
    <div id="decks"></div>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
